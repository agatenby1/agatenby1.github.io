<title>AI Acceptability Target</title>

<style>
/* Layout: one exhibit. The target fills the screen; clicking a segment opens a single panel over it. Nothing else on the page. */
:root{
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#f3f5f9; --panel:#ffffff; --ink:#15233a; --dim:#4d5d78; --muted:#7d8aa3;
  --line:#d6dde8; --grid:#e3e8f0; --axis:#b0bbcd; --scrim:rgba(21,35,58,.55);
  --link:#8a5f00; --tool:#15233a;
  --c1:#e0533f; --c2:#19b3a6; --c3:#3a7bdc; --c4:#b45bd0; --c5:#4bb75a; --c6:#f0a132; --c7:#8a7cf5; --c8:#ec4f86; --disp:'Anton',Impact,'Arial Narrow',sans-serif;

}

  --bg:#0b1120; --panel:#131b2c; --ink:#eef3ff; --dim:#aab7d0; --muted:#8190ab;
  --line:#2a3854; --grid:#223049; --axis:#4a5b7c; --scrim:rgba(3,7,16,.7); --link:#ffc83d; --tool:#eef3ff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b1120; --panel:#131b2c; --ink:#eef3ff; --dim:#aab7d0; --muted:#8190ab;
  --line:#2a3854; --grid:#223049; --axis:#4a5b7c; --scrim:rgba(3,7,16,.7); --link:#ffc83d; --tool:#eef3ff; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--link);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.stage{height:100%;display:flex;flex-direction:column;padding-block:16px 12px;padding-inline:20px;gap:8px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.head h1{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0}
.head p{margin:0;color:var(--dim);font-size:13px;flex:1 1 300px;min-width:0}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--grid)}
.fig{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.zoom{position:absolute;right:0;top:0;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom .btn{width:30px;height:30px;padding:0;font-size:16px;background:rgba(16,24,42,.8)}
#t{cursor:grab}#t.pan{cursor:grabbing}
#t{height:100%;width:100%;max-height:calc(100vh - 120px);display:block}
.seg{cursor:pointer}
.seg path{transition:fill-opacity .2s,transform .25s;transform-origin:0 0;stroke:rgba(255,255,255,.55);stroke-width:1}
.seg:hover path{fill-opacity:.62;transform:scale(1.02)}
.seg.open path{fill-opacity:.78;transform:scale(1.03);stroke:#fff}
.seg text{font:600 13.5px var(--f);letter-spacing:.14em;text-transform:uppercase;fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(5,10,24,.75);stroke-width:4px;stroke-linejoin:round}
.seg .n{font:500 11px var(--f);fill:rgba(255,255,255,.7);letter-spacing:.12em}
#globe{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
body{background:#060a16!important;color:#eef3ff}
:root{--bg:#060a16;--ink:#eef3ff;--dim:#aab7d0;--muted:#8190ab;--panel:#10182a;--line:#2a3854;--grid:#223049;--link:#ffc83d;--tool:#ffffff;--scrim:rgba(3,7,16,.72);color-scheme:dark}
.core{fill:rgba(6,10,22,.85);stroke:rgba(255,255,255,.5)}
.head h1{font:600 20px var(--f);letter-spacing:.12em;text-transform:uppercase}
.ctop h2{font:600 26px var(--f)!important;letter-spacing:.06em;text-transform:uppercase}
.fact b{font:600 24px var(--f)!important;letter-spacing:-.01em}
.poly{stroke-width:2;stroke-dasharray:none}
.pt{r:5.5}
.ring{fill:none;stroke:#fff;stroke-opacity:.28;stroke-width:.8}
.rl{font:400 10.5px var(--f);fill:var(--muted)}
.core{fill:var(--panel);stroke:var(--line)}
.core-t{font:600 13px var(--f);fill:var(--ink)}
.core-s{font:400 11px var(--f);fill:var(--dim)}
.hit{cursor:grab;fill:transparent}
.hit:focus-visible{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 2;outline:none}
.pt{fill:var(--tool);stroke:var(--panel);stroke-width:2}
.poly{fill:var(--tool);fill-opacity:.08;stroke:var(--tool);stroke-width:2;stroke-linejoin:round}
.foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:500;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-variant-numeric:tabular-nums}

.ovl{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(820px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column}
.band{height:6px;border-radius:14px 14px 0 0;background:var(--ac)}
.cbody{padding:18px 22px 20px;display:flex;flex-direction:column;gap:14px}
.ctop{display:flex;align-items:flex-start;gap:12px}
.ctop .k{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ac)}
.ctop h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:2px 0 0;line-height:1.2}
.ctop .q{color:var(--dim);font-size:14px;margin:2px 0 0}
.x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:16px;line-height:1}
.lede{font-size:15px;line-height:1.6;margin:0;max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fact{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.fact span{display:block;color:var(--dim);font-size:12px;margin-top:4px}
.fact a{display:block;font-size:11.5px;margin-top:5px}
.media{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.vid{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:inherit}
.vid:hover{background:var(--grid)}
.vid .play{width:34px;height:34px;border-radius:50%;background:var(--ac);flex:0 0 auto;display:grid;place-items:center}
.vid .play::after{content:'';border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.vid b{display:block;font-size:13px;font-weight:600}
.vid span{display:block;color:var(--dim);font-size:12px}
.place{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:var(--dim)}
.place input{width:100%;accent-color:var(--ink);margin:0}
.place b{color:var(--ink);font-variant-numeric:tabular-nums}
.L0 .cbody{background:var(--ac);color:#fff}.L0 .lede,.L0 .q,.L0 .k{color:#fff!important}.L0 .fact{background:rgba(255,255,255,.14);border-color:transparent}.L0 .fact span{color:rgba(255,255,255,.85)}.L0 a{color:#fff}.L0 .x,.L0 .btn{color:#fff;border-color:rgba(255,255,255,.4);background:transparent}.L0 .nav,.L0 .place{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.3)}.L0 .place b{color:#fff}.L0 .place input{accent-color:#fff}
.L1 .hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}.L1 .hero b{font:400 72px var(--disp);color:var(--ac);line-height:1}.L1 .hero span{font-size:15px;color:var(--dim)}.L1 .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
.L2 .tl{border-left:3px solid var(--ac);padding-left:14px;display:grid;gap:12px}.L2 .tl div{position:relative}.L2 .tl div::before{content:'';position:absolute;left:-20px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--ac)}.L2 .tl b{font:400 20px var(--disp);display:block}.L2 .tl span{color:var(--dim);font-size:13px}
.L3 .split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}.L3 .split .facts{grid-template-columns:minmax(0,1fr)}.L3 .lede{font-size:18px;line-height:1.45}
.L4 .facts{grid-template-columns:repeat(3,minmax(0,1fr))}.L4 .fact{background:var(--ac);border:0;color:#fff}.L4 .fact span,.L4 .fact a{color:rgba(255,255,255,.9)}.L4 .fact b{font-size:40px!important}
.L5 .lede{font:400 28px var(--disp);line-height:1.2;max-width:none;color:var(--ac)}.L5 .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
.L6 .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.L6 .cards .fact{border-left:5px solid var(--ac)}.L6 .cards .fact:nth-child(1){grid-column:span 2}
.L7 .big{text-align:center;padding:10px 0}.L7 .big b{font:400 60px var(--disp);display:block;color:var(--ac);line-height:1}.L7 .big span{color:var(--dim)}.L7 .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.L3 .split,.L1 .hero{grid-template-columns:minmax(0,1fr)}}
.nav{display:flex;gap:6px;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
@media (max-width:640px){.facts,.media{grid-template-columns:minmax(0,1fr)}.cbody{padding:14px 16px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
